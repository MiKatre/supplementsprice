name: Collect prices
# Three nightly runs, one per source group (see "group" in sources.json), so no run nears the time limit.
# Run by hand with a group and/or a list of source ids.
on:
  workflow_dispatch:
    inputs:
      group:
        description: "Source group: a, b or c (empty = all)"
        required: false
        default: ""
      only:
        description: "Comma-separated source ids"
        required: false
        default: ""
  schedule:
    - cron: "23 3 * * *"
    - cron: "23 4 * * *"
    - cron: "23 5 * * *"
permissions:
  contents: write
concurrency:
  group: collect-prices
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check . && uv run pytest -q
      - name: Install Chromium and a virtual display
        run: |
          uv run playwright install --with-deps chromium
          sudo apt-get install -y -q xvfb >/dev/null
      - name: Collect
        id: collect
        continue-on-error: true
        timeout-minutes: 50
        env:
          HEADED: "1"
          ONLY: ${{ inputs.only }}
          GROUP: ${{ inputs.group || (github.event.schedule == '23 3 * * *' && 'a') || (github.event.schedule == '23 4 * * *' && 'b') || (github.event.schedule == '23 5 * * *' && 'c') || '' }}
        run: xvfb-run -a uv run python -m supps.collect --budget 42 ${ONLY:+--only "$ONLY"} ${GROUP:+--group "$GROUP"}
      - name: Build site
        run: uv run python site/build.py
      - name: Keep run report and site
        uses: actions/upload-artifact@v4
        with:
          name: collection-${{ github.run_id }}
          path: |
            runs/report.json
            data/latest.json
            dist/
          retention-days: 14
      - name: Commit data
        env:
          GROUP: ${{ inputs.group }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history/ data/enrich.json data/site.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "chore(data): refresh prices${GROUP:+ (group $GROUP)}"
          git pull -q --rebase --autostash origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
      - name: Summary
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("runs/report.json"))
          print(f"## {r['offers']} offers · {r['by_kind']}")
          print("| source | status | offers | seconds | error |\n|---|---|---|---|---|")
          for sid, s in r["sources"].items():
              print(f"| {sid} | {s['status']} | {s.get('offers', s.get('kept_offers', ''))} | {s.get('seconds', '')} | {s.get('error', '')[:140]} |")
          PY
