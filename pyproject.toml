[project]
name = "supplementsprice"
version = "0.1.0"
description = "Creatine and whey prices per kg in Spain and France, refreshed by a scheduled collector."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "protego>=0.4,<0.6",
  "playwright>=1.50,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
